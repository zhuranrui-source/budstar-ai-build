name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budstar
          POSTGRES_PASSWORD: budstar
          POSTGRES_DB: budstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budstar -d budstar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://budstar:budstar@localhost:5432/budstar_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @budstar/api db:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm verify
